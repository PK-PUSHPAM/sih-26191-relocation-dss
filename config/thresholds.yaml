# ==============================================================================
# SIH 26191 - Decision Thresholds Configuration
# Blueprint Reference: Section 2 (OD-05, OD-08, OD-09), Sections 5, 8, 9, 23
# Note: Thresholds are configurable prototype parameters and subject to sensitivity analysis.
# ==============================================================================

version: "1.0"

# Red Zone Decision Rules & Thresholds (Section 5)
# Red Zone = any hard exclusion is TRUE OR combined risk H >= 0.70
red_zone:
  hard_exclusion_override: true
  red_zone_min_h: 0.70
  amber_zone_min_h: 0.55
  amber_zone_max_h: 0.70
  lower_risk_max_h: 0.55

# Relocation Priority Tiers (Section 9)
relocation_priority_tiers:
  immediate:
    min_score: 0.75
    label: "Immediate Relocation Need"
    description: "Highest modeled relocation urgency; requires authority review"
  short_term:
    min_score: 0.55
    max_score: 0.75
    label: "Short-Term Action"
    description: "Needs planned action in the near planning horizon"
  medium_term:
    min_score: 0.35
    max_score: 0.55
    label: "Medium-Term Mitigation"
    description: "Planned mitigation / relocation candidate"
  monitor:
    max_score: 0.35
    label: "Monitor"
    description: "Lower modeled priority under current inputs"

# Carrying Capacity & Bottleneck Rules (Section 8)
carrying_capacity:
  default_safety_factor: 0.80 # effective_capacity = floor(min(land, water, sanitation, health, access) * safety_factor)
  target_density_per_hectare: 150 # Modeling proxy for mountainous terrain
  daily_water_liters_per_capita: 70 # Mountainous rural standard proxy
  sanitation_service_factor: 1.0
  healthcare_person_per_bed: 1000

# Candidate Relocation Site Generation Constraints (Section 7)
candidate_site_generation:
  min_contiguous_area_hectares: 1.0
  max_allowable_slope_degrees: 30.0
  max_road_distance_meters: 2000.0

# L06 Rainfall Trigger
# No scientifically validated rainfall threshold is currently established.
# A caller must provide an explicitly marked prototype parameter at evaluation time.
rainfall_trigger:
  threshold_mm: null
  metric: "window_total_mm"
  comparison: "greater_equal"
  rule_version: "L06-trigger-1.0"
  parameter_status: "UNVALIDATED_PROTOTYPE_CONFIGURATION_REQUIRED"
